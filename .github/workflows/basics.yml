name: Basics

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: suadin/basic-specs/.github/actions/setup@v1.2.1
      - run: cd e2e && pnpm install --frozen-lockfile
      - run: cd e2e && pnpm exec playwright install --with-deps chromium
      - run: python3 -m diary test
      - run: cd e2e && pnpm test
      - run: python3 basics/check.py --root . check
